spring:
  config:
    config:
      import: optional:file:.env.local.properties
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: postgres
    password: 1234567

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

management:
  metrics:
    export:
      otlp:
        enabled: true
        url: http://localhost:4318/v1/metrics
        protocol: http/protobuf

stripe:
  secretKey: ${SECRET_KEY_STRIPE}
  publicKey: ${PUBLIC_KEY_STRIPE}
server:
  port: 8082
