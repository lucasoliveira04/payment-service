application:
  name: payment-service
  version: 1.0.0

server:
  port: 8082

management:
  metrics:
    export:
      otlp:
        enabled: true
        url: http://localhost:4318/v1/metrics
        protocol: http/protobuf

spring:
  rabbitmq:
    username: guest
    password: guest
    host: localhost
    port: 5672

  security:
    user:
      name: admin
      password: admin

stripe:
  secretKey: ${SECRET_KEY_STRIPE}
  publicKey: ${PUBLIC_KEY_STRIPE}